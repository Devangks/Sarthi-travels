<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#060913">
    <meta name="author" content="Pjmask">
    <title>Sarthi Travels | Premium Commute</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Noto+Sans+Devanagari:wght@500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="ambient-bg"></div>
    <div id="toast"><i id="toastIcon" class="fa-solid fa-bell"></i> <span id="toastMsg">Alert</span></div>
    <div id="splashScreen" class="splash-screen">
        <i class="fa-solid fa-van-shuttle" style="font-size:75px; color:var(--primary); filter:drop-shadow(0 0 25px var(--primary-glow));"></i>
        <h1 style="margin-top:25px; color:#fff; font-size: 40px; font-weight: 900; letter-spacing: 2px;">SARTHI</h1>
    </div>
    <div id="themeModal" class="theme-modal"></div>
    <div class="app-frame">
        <div class="top-nav">
            <div class="brand-logo">
                <span style="background: linear-gradient(to right, var(--primary-light), var(--primary)); -webkit-background-clip: text; -webkit-text-fill-color: transparent;"><i class="fa-solid fa-bus"></i> SARTHI</span>
                <span id="adminTag" style="display:none; color:#fff; background:var(--danger); padding:4px 8px; font-size:10px; font-weight:900; border-radius:6px;">ADMIN</span>
            </div>
            <div style="display:flex; gap:10px; align-items:center;">
                <button class="icon-btn" onclick="UI.toggleTheme()" aria-label="Theme"><i class="fa-solid fa-palette"></i></button>
                <button class="icon-btn" onclick="Lang.toggle()" aria-label="Language">A/अ</button>
                <div style="font-size:12px; font-weight: 800; color:var(--text-main); background:rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); padding:6px 14px; border-radius:20px;" id="userNameDisplay"></div>
            </div>
        </div>
        <div id="authScreen" class="screen active"></div>
        <div id="homeScreen" class="screen"></div>
        <div id="seatScreen" class="screen"></div>
        <div id="passengerScreen" class="screen"></div>
        <div id="checkoutScreen" class="screen"></div>
        <div id="ticketScreen" class="screen"></div>
        <div id="tripsScreen" class="screen"></div>
        <div id="adminScreen" class="screen"></div>
        <div class="bottom-nav" id="botNav" style="display:none;"></div>
    </div>

    <!-- required for Firebase Phone Auth RecaptchaVerifier -->
    <div id="recaptcha-container" style="display:none;"></div>

    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/language.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/booking.js"></script>
    <script src="js/admin.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
